<div class="h-screen bg-slate-950 flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 p-10 rounded-xl shadow-2xl">
        <h2 class="text-white text-xl font-bold mb-6">ARF Kurumsal Portal</h2>
        <input type="password" id="pass" class="w-full p-3 bg-slate-800 text-white rounded mb-4" placeholder="Yetkili Şifresi">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-500 transition">GİRİŞ</button>
    </div>
</div>
<script>
    function login() {
        if(document.getElementById('pass').value === "ARF2026") {
            sessionStorage.setItem("logged_in", "true");
            window.location.href = "/crm/index.html"; // CRM'in yüklü olduğu klasör
        } else {
            alert("Yetkisiz Giriş Denemesi!");
        }
    }
</script>

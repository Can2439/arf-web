<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050608">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title></title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050608;
      }

      body {
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      body::before {
        content: "";
        position: fixed;
        z-index: -3;
        inset: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.98) 0 18%, rgba(245, 245, 244, 0.96) 42%, rgba(225, 225, 224, 0.92) 100%),
          #f3f3f2;
        transform: scale(1.04);
        animation: ambient-power 18s linear infinite;
      }

      body::after {
        content: "";
        position: fixed;
        z-index: 6;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 50%, transparent 18%, rgba(0, 0, 0, 0.18) 62%, rgba(0, 0, 0, 0.72) 125%),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 4px);
        opacity: 0;
        animation: vignette-in 18s linear infinite;
      }

      .stage {
        position: relative;
        width: min(78vw, 426px);
        aspect-ratio: 284 / 71;
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .stage::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: 30%;
        aspect-ratio: 1;
        left: 0;
        top: 50%;
        translate: -4% -50%;
        border-radius: 50%;
        background: rgba(226, 57, 66, 0.42);
        filter: blur(34px);
        opacity: 0;
        animation: red-core 18s linear infinite;
      }

      .stage::after {
        content: "";
        position: absolute;
        z-index: 4;
        inset: -10%;
        background: linear-gradient(90deg, transparent 0 46%, rgba(5, 6, 8, 0.94) 54% 100%);
        opacity: 0;
        transform: translateX(-105%);
        animation: shutdown-sweep 18s cubic-bezier(0.72, 0, 0.28, 1) infinite;
      }

      .logo {
        width: 100%;
        height: auto;
        display: block;
        opacity: 0;
        transform: translateY(0) scale(0.985);
        filter: grayscale(0) brightness(1) drop-shadow(0 0 0 rgba(226, 57, 66, 0));
        animation: logo-failure 18s linear infinite;
        will-change: opacity, filter, transform;
      }

      @keyframes ambient-power {
        0%, 5% { opacity: 0; }
        12%, 27% { opacity: 1; }
        28% { opacity: 0.68; }
        29% { opacity: 1; }
        31% { opacity: 0.34; }
        32% { opacity: 0.96; }
        35% { opacity: 0.18; }
        37% { opacity: 0.72; }
        42% { opacity: 0.12; }
        48%, 100% { opacity: 0; }
      }

      @keyframes vignette-in {
        0%, 24% { opacity: 0; }
        34% { opacity: 0.2; }
        48% { opacity: 0.72; }
        65%, 100% { opacity: 1; }
      }

      @keyframes red-core {
        0%, 8% { opacity: 0; transform: scale(0.72); }
        14%, 25% { opacity: 0.74; transform: scale(1); }
        28% { opacity: 0.2; }
        29% { opacity: 0.82; }
        31% { opacity: 0.12; }
        32% { opacity: 0.66; }
        38% { opacity: 0.3; }
        48% { opacity: 0.08; transform: scale(0.8); }
        58%, 100% { opacity: 0; transform: scale(0.42); }
      }

      @keyframes shutdown-sweep {
        0%, 36% { opacity: 0; transform: translateX(-105%); }
        42% { opacity: 0.28; }
        55% { opacity: 0.8; transform: translateX(45%); }
        68%, 100% { opacity: 0; transform: translateX(110%); }
      }

      @keyframes logo-failure {
        0%, 5% {
          opacity: 0;
          transform: translateY(0) scale(0.985);
          filter: grayscale(0.3) brightness(0.58) drop-shadow(0 0 0 rgba(226, 57, 66, 0));
        }
        12%, 26% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: grayscale(0) brightness(1) drop-shadow(0 0 18px rgba(226, 57, 66, 0.18));
        }
        28% { opacity: 0.5; filter: grayscale(0.08) brightness(0.78); }
        29% { opacity: 1; filter: grayscale(0) brightness(1.03); }
        31% { opacity: 0.24; filter: grayscale(0.38) brightness(0.62); }
        32% { opacity: 0.92; filter: grayscale(0.04) brightness(0.94); }
        35% { opacity: 0.34; filter: grayscale(0.55) brightness(0.56); }
        37% { opacity: 0.76; filter: grayscale(0.18) brightness(0.82); }
        45% {
          opacity: 0.5;
          transform: translateY(1px) scale(0.998);
          filter: grayscale(0.52) brightness(0.62) drop-shadow(0 0 8px rgba(226, 57, 66, 0.08));
        }
        58% {
          opacity: 0.2;
          transform: translateY(4px) scale(0.994);
          filter: grayscale(0.88) brightness(0.42) drop-shadow(0 0 0 rgba(226, 57, 66, 0));
        }
        72%, 92% {
          opacity: 0.07;
          transform: translateY(6px) scale(0.99);
          filter: grayscale(1) brightness(0.3);
        }
        100% {
          opacity: 0;
          transform: translateY(6px) scale(0.99);
          filter: grayscale(1) brightness(0.24);
        }
      }

      @media (max-width: 420px) {
        .stage {
          width: 82vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before {
          opacity: 0;
          animation: none;
        }

        body::after {
          opacity: 1;
          animation: none;
        }

        .stage::before,
        .stage::after {
          display: none;
        }

        .logo {
          opacity: 0.18;
          transform: none;
          filter: grayscale(1) brightness(0.4);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="ARF İleri Teknoloji">
      <img class="logo" src="/arf-logo.png" width="284" height="71" alt="ARF İleri Teknoloji">
    </main>
  </body>
</html>

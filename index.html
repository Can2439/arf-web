<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020304">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title></title>
    <style>
      :root {
        color-scheme: dark;
        background: #020304;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020304;
      }

      body {
        display: grid;
        place-items: center;
        isolation: isolate;
      }

      .fallback {
        position: fixed;
        z-index: -2;
        width: min(58vw, 360px);
        height: auto;
        opacity: 0.09;
        filter: grayscale(1) brightness(0.55);
      }

      .film {
        position: fixed;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        background: #020304;
      }

      .shade {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 48%, transparent 54%, rgba(0, 0, 0, 0.18) 82%, rgba(0, 0, 0, 0.48) 130%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.08), transparent 16%, transparent 82%, rgba(0, 0, 0, 0.14));
      }

      @media (max-aspect-ratio: 4 / 3) {
        .film {
          object-fit: contain;
        }

        .shade {
          background: radial-gradient(circle at 50% 50%, transparent 42%, rgba(0, 0, 0, 0.2) 82%, rgba(0, 0, 0, 0.48) 130%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .film {
          display: none;
        }

        .fallback {
          opacity: 0.15;
        }
      }
    </style>
  </head>
  <body>
    <img class="fallback" src="/arf-logo.png" width="284" height="71" alt="">
    <video
      class="film"
      autoplay
      muted
      playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      aria-label="ARF İleri Teknoloji arşiv kapanışı"
    >
      <source src="/arf-archive.mp4" type="video/mp4">
    </video>
    <div class="shade" aria-hidden="true"></div>
    <script>
      const film = document.querySelector(".film");

      film.addEventListener("ended", () => {
        window.setTimeout(() => {
          film.currentTime = 0;
          film.play().catch(() => {});
        }, 5000);
      });
    </script>
  </body>
</html>
